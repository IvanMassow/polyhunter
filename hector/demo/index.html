<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>See Hector work — a three-minute walkthrough</title>
<meta name="description" content="An interactive preview of Hector's core loop: tell it about your firm, answer one prompt a month, and watch your board report draft itself from your own evidence.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fcfcfd; --panel:#fff; --ink:#1a1d29; --soft:#5a6072; --faint:#9598a6;
    --line:#e9eaf0; --accent:#5266eb; --accent-deep:#3d4fd0; --accent-soft:#eef0fd;
    --green:#1f9d6b; --green-soft:#e7f6ef; --amber:#c87f1f; --amber-soft:#fdf3e3;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter',-apple-system,sans-serif; font-size:16px; line-height:1.6; font-weight:450;
    color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  nav { border-bottom:1px solid var(--line); background:rgba(252,252,253,.85); backdrop-filter:blur(14px); position:sticky; top:0; z-index:40; }
  .nav-inner { max-width:1140px; margin:0 auto; padding:0 28px; display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo { font-size:19px; font-weight:700; letter-spacing:-0.02em; color:var(--ink); text-decoration:none; }
  .logo span { color:var(--accent); }
  .nav-note { font-size:13px; color:var(--faint); }

  main { flex:1; display:flex; align-items:flex-start; justify-content:center; padding:48px 24px 80px; }
  .stage { width:100%; max-width:780px; }

  .steps-rail { display:flex; gap:8px; margin-bottom:34px; }
  .steps-rail i { flex:1; height:4px; border-radius:2px; background:var(--line); transition:background .3s; }
  .steps-rail i.on { background:var(--accent); }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:40px 44px; animation:fade .4s ease; }
  @media (max-width:620px) { .card { padding:28px 22px; } }
  @keyframes fade { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:none; } }
  .kicker { font-size:12.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:14px; }
  .card h1 { font-size:clamp(24px,3.4vw,32px); font-weight:600; letter-spacing:-0.03em; line-height:1.2; margin-bottom:12px; }
  .card .lede { color:var(--soft); margin-bottom:26px; font-size:15.5px; }
  .btn {
    display:inline-block; font-family:'Inter',sans-serif; font-size:15px; font-weight:600;
    padding:13px 26px; border-radius:10px; border:none; cursor:pointer; text-decoration:none;
    transition:all .15s ease;
  }
  .btn-accent { background:var(--accent); color:#fff; }
  .btn-accent:hover { background:var(--accent-deep); transform:translateY(-1px); }
  .btn-ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .btn-ghost:hover { border-color:var(--faint); }
  .btn:disabled { opacity:.4; cursor:default; transform:none !important; }
  .meta-row { display:flex; gap:20px; margin-top:20px; font-size:13px; color:var(--faint); flex-wrap:wrap; }

  /* intake form */
  .field { margin-bottom:20px; }
  .field label { display:block; font-size:13.5px; font-weight:600; margin-bottom:7px; }
  .field input, .field select {
    width:100%; font-family:'Inter',sans-serif; font-size:15px; padding:12px 16px;
    border:1px solid var(--line); border-radius:10px; background:#fff; outline:none;
  }
  .field input:focus, .field select:focus { border-color:var(--accent); }
  .checks { display:flex; flex-wrap:wrap; gap:10px; }
  .check {
    font-size:14px; font-weight:500; padding:9px 16px; border-radius:100px;
    border:1px solid var(--line); cursor:pointer; user-select:none; transition:all .12s;
  }
  .check.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

  /* hector speaks */
  .hx { display:flex; gap:14px; margin:22px 0; }
  .hx .av {
    width:34px; height:34px; border-radius:10px; background:var(--ink); color:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
  }
  .hx .bubble {
    background:var(--accent-soft); border:1px solid #dde2fb; border-radius:4px 14px 14px 14px;
    padding:14px 18px; font-size:14.5px; color:var(--ink);
  }
  .hx .bubble b { font-weight:600; }
  .hx .bubble small { display:block; color:var(--soft); margin-top:6px; font-size:12.5px; }

  /* vault build animation */
  .build-list { margin:8px 0 4px; }
  .build-item {
    display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line);
    font-size:14px; color:var(--soft); opacity:0; transform:translateY(6px); transition:all .35s ease;
  }
  .build-item.show { opacity:1; transform:none; }
  .build-item .tick { color:var(--green); font-weight:700; }
  .build-item b { color:var(--ink); font-weight:600; }

  /* prompt step */
  .evidence-pop {
    border:1px solid #cdebdc; background:var(--green-soft); border-radius:12px;
    padding:16px 20px; margin:18px 0 6px; font-size:14px; color:#14573c;
    opacity:0; transform:translateY(8px); transition:all .4s ease;
  }
  .evidence-pop.show { opacity:1; transform:none; }
  .evidence-pop b { font-weight:600; }
  .evidence-pop .eid { font-size:11px; font-weight:700; color:var(--green); letter-spacing:.05em; }

  /* report drafting */
  .docpane {
    border:1px solid var(--line); border-radius:12px; padding:30px 34px; margin-top:6px;
    font-family:'Source Serif 4',Georgia,serif; font-size:14.5px; line-height:1.75; color:#2a2e3d;
    min-height:120px;
  }
  .docpane .eyebrow { font-family:'Inter',sans-serif; font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:10px; }
  .docpane p { margin-bottom:14px; opacity:0; transform:translateY(6px); transition:all .5s ease; }
  .docpane p.show { opacity:1; transform:none; }
  .cite {
    font-family:'Inter',sans-serif; font-size:10px; font-weight:600; color:var(--accent);
    background:var(--accent-soft); padding:1px 7px; border-radius:5px; white-space:nowrap; cursor:pointer;
  }
  .gapbox {
    font-family:'Inter',sans-serif; font-size:12.5px; background:var(--amber-soft);
    border:1px solid #f3e2c0; border-radius:8px; padding:11px 15px; color:#7a5113; margin:14px 0;
    opacity:0; transform:translateY(6px); transition:all .5s ease;
  }
  .gapbox.show { opacity:1; transform:none; }
  .thinking { font-family:'Inter',sans-serif; font-size:13px; color:var(--faint); display:flex; align-items:center; gap:10px; }
  .thinking .pulse { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:pulse 1s ease infinite; }
  @keyframes pulse { 0%,100% { opacity:.3; } 50% { opacity:1; } }

  .citenote { font-size:12.5px; color:var(--faint); margin-top:14px; }
  .citenote .cite { font-size:10px; }

  /* final */
  .pricecard { display:flex; gap:26px; align-items:center; border:1px solid var(--line); border-radius:14px; padding:22px 26px; margin:24px 0; flex-wrap:wrap; }
  .pricecard .p { font-size:30px; font-weight:700; letter-spacing:-0.03em; }
  .pricecard .p span { font-size:13px; color:var(--faint); font-weight:450; }
  .pricecard .d { font-size:13.5px; color:var(--soft); flex:1; min-width:220px; }

  footer { border-top:1px solid var(--line); padding:26px; text-align:center; font-size:12px; color:var(--faint); }
  footer a { color:var(--soft); }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="../">Hector<span>.</span></a>
    <span class="nav-note">Interactive preview · fictional data</span>
  </div>
</nav>

<main><div class="stage" id="stage"></div></main>

<footer>
  This walkthrough uses illustrative data for a fictional firm. Hector drafts from evidence and never gives regulated advice. <a href="../">About Hector</a>
</footer>

<script>
const S = { firm:"", advisers:"2–5", services:[] };
const stage = document.getElementById("stage");

function rail(n) {
  return `<div class="steps-rail">${[0,1,2,3,4].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>`;
}

/* ---------- step 0: welcome ---------- */
function s0() {
  stage.innerHTML = rail(0) + `
  <div class="card">
    <div class="kicker">Three minutes · no signup</div>
    <h1>This is the whole product, in one loop.</h1>
    <p class="lede">Tell Hector about a firm, answer one monthly prompt, and watch a board-report section draft itself from the evidence — footnotes and all. Everything you're about to see is the real product design, running with fictional data.</p>
    <button class="btn btn-accent" onclick="s1()">Start the walkthrough</button>
    <div class="meta-row"><span>Step 1 · Tell Hector about the firm</span><span>Step 2 · The monthly ten minutes</span><span>Step 3 · Report season</span></div>
  </div>`;
}

/* ---------- step 1: intake ---------- */
function s1() {
  stage.innerHTML = rail(1) + `
  <div class="card">
    <div class="kicker">Step 1 of 3 · The intake — about 40 minutes in real life</div>
    <h1>Tell Hector about your firm.</h1>
    <p class="lede">In the real intake you'd answer plain-English questions and upload whatever you have — policies, complaints log, file reviews. Messy is fine; messy is the point. Here, just the basics:</p>
    <div class="field">
      <label>Firm name</label>
      <input id="firm" placeholder="e.g. Whitmore &amp; Hale Ltd" maxlength="40">
    </div>
    <div class="field">
      <label>Advisers / certified staff</label>
      <select id="advisers"><option>Just me</option><option selected>2–5</option><option>6–15</option></select>
    </div>
    <div class="field">
      <label>What you do (tap all that apply)</label>
      <div class="checks" id="svc">
        ${["Investment advice","Pensions & retirement","Protection","Mortgages"].map(s=>`<span class="check" onclick="this.classList.toggle('on')">${s}</span>`).join("")}
      </div>
    </div>
    <button class="btn btn-accent" onclick="s1b()">Build my compliance profile</button>
  </div>`;
}

function s1b() {
  S.firm = (document.getElementById("firm").value || "Whitmore & Hale Ltd").trim();
  S.advisers = document.getElementById("advisers").value;
  S.services = [...document.querySelectorAll("#svc .check.on")].map(e=>e.textContent);
  if (!S.services.length) S.services = ["Investment advice","Pensions & retirement"];

  const items = [
    [`Reading your documents`, `4 policies, a complaints log and last year's file reviews — ingested and indexed`],
    [`Mapping your obligations`, `${S.services.length} service lines → the four Consumer Duty outcomes, sized for a ${S.advisers.toLowerCase()} firm`],
    [`Building the SM&CR map`, `SMF16 responsibilities drafted for your sign-off`],
    [`Finding your gaps`, `2 evidence gaps found — turned into actions, not problems`],
    [`Scheduling the year`, `Monthly prompts set; report season planned backwards from your ARD`],
  ];
  stage.innerHTML = rail(1) + `
  <div class="card">
    <div class="kicker">Step 1 of 3 · Hector is reading</div>
    <h1>Building the compliance profile for ${esc(S.firm)}.</h1>
    <div class="build-list">
      ${items.map(i=>`<div class="build-item"><span class="tick">✓</span><span><b>${i[0]}.</b> ${i[1]}</span></div>`).join("")}
    </div>
    <div class="hx" style="opacity:0; transition:opacity .5s;" id="hxmsg">
      <div class="av">H</div>
      <div class="bubble"><b>Your vault is live.</b> From here, I only need ten minutes of you a month. Let me show you what those ten minutes look like.<small>— Hector</small></div>
    </div>
    <button class="btn btn-accent" id="next1" style="opacity:0; transition:opacity .5s;" onclick="s2()">Show me the monthly ten minutes</button>
  </div>`;
  document.querySelectorAll(".build-item").forEach((el,i)=>setTimeout(()=>el.classList.add("show"), 350+i*520));
  setTimeout(()=>{ document.getElementById("hxmsg").style.opacity=1; document.getElementById("next1").style.opacity=1; }, 350+items.length*520+300);
}

/* ---------- step 2: monthly prompt ---------- */
function s2() {
  stage.innerHTML = rail(2) + `
  <div class="card">
    <div class="kicker">Step 2 of 3 · A Tuesday in May, 9:02am</div>
    <h1>One email a month. This one.</h1>
    <p class="lede">No dashboard to remember to visit. Hector emails one prompt; you tap an answer; the evidence files itself.</p>
    <div class="hx">
      <div class="av">H</div>
      <div class="bubble"><b>Morning. Quick one for May:</b> any complaints, expressions of dissatisfaction, or vulnerable-client cases this month at ${esc(S.firm)}?<small>— Hector, keeping your Consumer support outcome current</small></div>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;">
      <button class="btn btn-ghost" onclick="s2b(false)">Nothing to report</button>
      <button class="btn btn-accent" onclick="s2b(true)">One thing happened…</button>
    </div>
  </div>`;
}

function s2b(hasItem) {
  const popHtml = hasItem
    ? `<div class="evidence-pop" id="pop">
        <span class="eid">E-148 · FILED</span><br>
        <b>Complaint logged:</b> delayed annual review (client deferred twice, then complained about contact). Root cause recorded as <b>diary process</b>, not advice quality. Filed to <b>Consumer support</b>; your outcomes MI updated; a follow-up action created with a 10-day reminder.
       </div>`
    : `<div class="evidence-pop" id="pop">
        <span class="eid">E-148 · FILED</span><br>
        <b>Nil return recorded for May</b> — and that's evidence too. A year of documented "nothing happened, and we checked" is exactly what the FCA's review found firms couldn't show. Your Consumer support outcome stays green, with proof.
       </div>`;
  stage.innerHTML = rail(2) + `
  <div class="card">
    <div class="kicker">Step 2 of 3 · 9:03am — done</div>
    <h1>That was the whole month.</h1>
    ${popHtml}
    <div class="hx" style="margin-top:18px;">
      <div class="av">H</div>
      <div class="bubble"><b>One more thing — the FCA published this morning.</b> A consultation on advice/guidance boundaries. I've read it: <b>nothing applies to your permissions.</b> Logged, in case anyone ever asks how you know.<small>That's the horizon-scanning you never have to do again</small></div>
    </div>
    <button class="btn btn-accent" onclick="s3()">Fast-forward to report season →</button>
  </div>`;
  setTimeout(()=>document.getElementById("pop").classList.add("show"), 250);
}

/* ---------- step 3: report season ---------- */
function s3() {
  stage.innerHTML = rail(3) + `
  <div class="card">
    <div class="kicker">Step 3 of 3 · Eleven months later</div>
    <h1>Report season. Press the button.</h1>
    <p class="lede">Twelve months of prompts have become 140+ filed evidence items. Hector now drafts your annual Consumer Duty board report — section by section, every sentence footnoted to a document you can click.</p>
    <button class="btn btn-accent" onclick="s3b()">Draft my Price &amp; value section</button>
  </div>`;
}

function s3b() {
  stage.innerHTML = rail(3) + `
  <div class="card">
    <div class="kicker">Step 3 of 3 · Drafting</div>
    <h1>Price &amp; value — drafted from your year.</h1>
    <div class="thinking" id="think"><span class="pulse"></span>Reading 23 evidence items filed to this outcome…</div>
    <div class="docpane" id="doc" style="display:none;">
      <div class="eyebrow">Consumer Duty annual board report · ${esc(S.firm)} · Section 4</div>
      <p>The firm completed its annual fee schedule review on 28 May <span class="cite">E-147</span>, benchmarking ongoing advice charges against published peer data. Charges remain within the second quartile of the comparator set, and no client segment was identified as receiving materially lower value relative to fees paid <span class="cite">E-147</span>.</p>
      <p>Ongoing service delivery was evidenced through completion of 96% of scheduled annual reviews <span class="cite">E-112</span>. The reviews not completed related to clients who deferred at their own request; each deferral is documented with a follow-up date <span class="cite">E-113</span>, including the May complaint and its resolution <span class="cite">E-148</span>.</p>
      <div class="gapbox" id="gap"><b>Hector flagged one gap:</b> no documented value assessment for protection-only clients. Suggested action created (est. 2 hours). This section updates itself when you file it.</div>
      <p id="lastp">On the basis of the evidence above, the board is invited to conclude that the firm's services continue to provide fair value, subject to the action noted.</p>
    </div>
    <p class="citenote" id="citenote" style="opacity:0; transition:opacity .5s;">Every <span class="cite">E-…</span> is a real document in your vault. Click it, see the source. Nothing is asserted that can't be shown — including the gap, flagged honestly instead of papered over.</p>
    <button class="btn btn-accent" id="approve" style="opacity:0; transition:opacity .5s; margin-top:14px;" onclick="s4()">Approve section → finish walkthrough</button>
  </div>`;
  const doc = document.getElementById("doc");
  setTimeout(()=>{ document.getElementById("think").style.display="none"; doc.style.display="block";
    const ps = doc.querySelectorAll("p, .gapbox");
    ps.forEach((p,i)=>setTimeout(()=>p.classList.add("show"), 200+i*850));
    setTimeout(()=>{ document.getElementById("citenote").style.opacity=1; document.getElementById("approve").style.opacity=1; }, 200+ps.length*850+300);
  }, 1900);
}

/* ---------- step 4: close ---------- */
function s4() {
  stage.innerHTML = rail(4) + `
  <div class="card">
    <div class="kicker">That's the loop</div>
    <h1>Forty minutes once. Ten minutes a month. One afternoon a year.</h1>
    <p class="lede">That's the entire offering: ${esc(S.firm)} walks into report season with the work already done, the evidence already filed, and an honest list of what's left. Hector drafts; you approve; the responsibility — and the credit — stays yours.</p>
    <div class="pricecard">
      <div><div class="p">£149<span> /month</span></div></div>
      <div class="d">Solo firms — or £249/month for up to five advisers. Price locked at renewal, capped at CPI, in the contract. Cancel any time, export everything.</div>
    </div>
    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      <a class="btn btn-accent" href="../score/">Get your free readiness score</a>
      <a class="btn btn-ghost" href="../">Back to the site</a>
    </div>
    <div class="meta-row"><span>No sales calls</span><span>Self-serve from day one</span><span>Your data never trains our models</span></div>
  </div>`;
}

function esc(s){ return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

s0();
</script>
</body>
</html>
